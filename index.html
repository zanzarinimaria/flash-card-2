<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards de Óptica - Robótica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Flashcards de Óptica</h1>
        <p class="subtitulo">Clique no cartão para ver a resposta!</p>

        <!-- Flashcards Interativos -->
        <div class="flashcard" id="card" onclick="virarCard()">
            <div class="conteudo-card">
                <!-- ID Pergunta e ID Resposta agora estão separados corretamente -->
                <h3 id="pergunta">Carregando pergunta...</h3> 
                <p id="resposta" class="escondido">Carregando resposta...</p>
            </div>
        </div>
    
        <!-- Botões de Navegação -->
        <div class="botoes">
            <button onclick="proximoCard(event)">Próximo Card</button>
        </div>
    </div>

    <!-- O script DEVE ficar aqui no final, com o atributo defer -->
    <script src="script.js" defer></script>
</body>
</html>
