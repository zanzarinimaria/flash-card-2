<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards de Óptica - Robótica</title>
    <!-- Link corrigido apontando para o arquivo CSS local -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <h1>Flashcards de Óptica</h1>
        <p class="subtitulo">Clique no cartão para ver a resposta!</p>

        <!-- Flashcards Interativos -->
        <div class="flashcard" id="card" onclick="virarCard()">
            <div class="conteudo-card">
                <!-- Tags com IDs únicos que o script.js vai gerenciar -->
                <h3 id="pergunta">Carregando pergunta...</h3> 
                <p id="resposta" class="escondido">Carregando resposta...</p>
            </div>
        </div>
    
        <!-- Botões de Navegação -->
        <div class="botoes">
            <!-- event.stopPropagation() impede o clique de ativar o card de trás -->
            <button onclick="proximoCard(event)">Próximo Card</button>
        </div>
    </div>

    <!-- Script carregado de forma segura no final do corpo -->
    <script src="./script.js" defer></script>
</body>
</html>
